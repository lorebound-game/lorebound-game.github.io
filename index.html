<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c22"><title>LOREBOUND</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#243744}body{background:linear-gradient(#0a141ae8,#0b1319ed),url('assets/title.png') center/cover;font-family:serif}.screen{display:block;position:relative;width:100%;height:100vh;height:100dvh;margin:0;overflow:hidden;background:#101e27 url('assets/title.png') center center/cover no-repeat;box-shadow:0 0 90px #02070c;isolation:isolate;text-decoration:none;-webkit-tap-highlight-color:transparent}.screen:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(#0b172126,transparent 37%,transparent 85%,#0b172132 100%)}.screen:focus-visible{outline:2px solid #dec697;outline-offset:-5px}h1{position:absolute;top:max(12%,env(safe-area-inset-top));left:50%;width:90%;max-width:650px;transform:translateX(-50%);margin:0}h1 img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 6px #06141bb8)}.spark{position:absolute;background:#eadba3;width:2px;height:2px;box-shadow:0 0 5px #eadba3;pointer-events:none;animation:float 7s infinite ease-in-out}.spark:nth-of-type(even){background:#c6dbea;animation-delay:-3s}@keyframes float{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:.7;transform:translate(7px,-23px)}}@media(prefers-reduced-motion:reduce){.spark{animation:none}}
body:after{content:"";position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}body.leaving-title:after{opacity:1;pointer-events:auto}@media(prefers-reduced-motion:reduce){body:after{transition:none}}
.screen{animation:titleScenery 22s ease-in-out infinite alternate}
.screen h1{animation:titleFloat 7s ease-in-out infinite;will-change:transform}
.title-mist{position:absolute;left:-15%;right:-15%;bottom:6%;height:27%;background:radial-gradient(ellipse at 30% 65%,#b4d3db12,transparent 60%),radial-gradient(ellipse at 75% 45%,#adbed510,transparent 62%);pointer-events:none;animation:titleMist 20s ease-in-out infinite alternate}
.title-orbit{position:absolute;width:4px;height:4px;border-radius:50%;background:#b9d8f2;box-shadow:0 0 6px #a9c4f4;pointer-events:none;opacity:.55;animation:titleOrbit 9s var(--delay,0s) ease-in-out infinite}
@keyframes titleFloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
@keyframes titleScenery{from{background-position:49% 49%}to{background-position:52% 52%}}
@keyframes titleMist{from{transform:translateX(-15px);opacity:.35}to{transform:translateX(25px);opacity:.7}}
@keyframes titleOrbit{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(13px,-22px);opacity:.65}}
@media(prefers-reduced-motion:reduce){.screen,.screen h1,.title-mist,.title-orbit{animation:none!important}}
.opening-sound{position:fixed;z-index:5;right:18px;bottom:max(20px,env(safe-area-inset-bottom));width:44px;height:44px;border:1px solid #ab9360;border-radius:50%;background:#071724c9;color:#f4dfab;font:24px Georgia,serif;cursor:pointer;touch-action:manipulation}.opening-sound:focus-visible{outline:2px solid #efd597;outline-offset:3px}</style><link rel="stylesheet" href="save-backups.css?v=save-a1"></head><body><a class="screen" href="prologue.html" aria-label="LOREBOUND. Enter the game."><h1><img src="assets/lorebound-logo-vines.png" alt="LOREBOUND"></h1><i class="spark" style="top:48%;left:71%"></i><i class="spark" style="top:63%;left:19%"></i><i class="spark" style="top:72%;left:78%"></i><i class="spark" style="top:55%;left:48%"></i><span class="title-mist" aria-hidden="true"></span><i class="title-orbit" style="left:21%;top:48%;--delay:-2s" aria-hidden="true"></i><i class="title-orbit" style="left:78%;top:39%;--delay:-5s" aria-hidden="true"></i><i class="title-orbit" style="left:63%;top:73%;--delay:-7s" aria-hidden="true"></i></a><a class="backup-entry-link" href="save-backups.html">Save backups</a><button id="openingSound" class="opening-sound" type="button" aria-label="Play opening music" aria-pressed="false">♪</button><script src="opening-music.js?v=adventure-refine1"></script><script src="title-entry.js?v=adventure-refine1"></script></body></html>
